; ==============================================================================
; PlatformIO Project Configuration for SIH26025 Subsurface Mine Sensor Node
; Target: ESP32-S3-WROOM-1 / ESP32-S3-DevKitC-1
; ==============================================================================

[platformio]
default_envs = esp32s3_node
src_dir = src
include_dir = include

[env:esp32s3_node]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Configuration
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, colorize, esp32_exception_decoder

; Build Optimization Flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DIN865_FREQ=865200000
    -DNODE_FIRMWARE_VER=\"2.4.0\"

; Library Dependencies
lib_deps = 
    jgromes/RadioLib @ ^6.4.2
    adafruit/Adafruit BNO08x @ ^1.2.5
    Wire
    SPI
